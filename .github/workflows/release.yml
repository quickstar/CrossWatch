name: release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Version bump from the newest tag (ignored when version is set)"
        type: choice
        options: [patch, minor, major]
        default: patch
      version:
        description: "Explicit version, e.g. 0.11.0 or 0.11.1-quickstar.1 (overrides bump)"
        type: string
      latest:
        description: "Also push the :latest tag"
        type: boolean
        default: true
      draft:
        description: "Create the GitHub Release as a draft"
        type: boolean
        default: true
      discussion:
        description: "Create a discussion for this release"
        type: boolean
        default: false
      discussion_category:
        description: "Discussion category"
        type: choice
        options: [Announcements, General, Ideas, "Q&A", Support]
        default: Announcements

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/crosswatch
  DOCKERHUB_IMAGE: docker.io/${{ github.repository_owner }}/crosswatch

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      discussions: write
    steps:
      - name: Check release ref
        env:
          REF_NAME: ${{ github.ref_name }}
          IN_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail

          if [ "${REF_NAME}" = "main" ]; then
            exit 0
          fi

          version="${IN_VERSION#v}"
          if [ "${REF_NAME}" = "fix-stremio-episode-history" ] \
            && [[ "${version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+-quickstar\.[0-9]+$ ]]; then
            exit 0
          fi

          echo "Release ref ${REF_NAME} is not allowed for version ${version:-unset}"
          exit 1

      - name: Resolve image registries
        id: registries
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          set -euo pipefail

          dockerhub_enabled=false
          if [ -n "${DOCKERHUB_USERNAME}" ] && [ -n "${DOCKERHUB_TOKEN}" ]; then
            dockerhub_enabled=true
          else
            echo "::warning::Docker Hub credentials are not configured; publishing to GHCR only"
          fi

          echo "dockerhub_enabled=${dockerhub_enabled}" >> "$GITHUB_OUTPUT"
          {
            echo 'images<<EOF'
            echo "${IMAGE}"
            if [ "${dockerhub_enabled}" = "true" ]; then
              echo "${DOCKERHUB_IMAGE}"
            fi
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Resolve version
        id: ver
        env:
          IN_VERSION: ${{ inputs.version }}
          IN_BUMP: ${{ inputs.bump }}
        run: |
          set -euo pipefail

          last="$(git tag -l 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -n1)"
          echo "Newest tag: ${last:-none}"

          if [ -n "${IN_VERSION}" ]; then
            version="${IN_VERSION#v}"
          else
            base="${last#v}"
            base="${base:-0.0.0}"
            base="${base%%-*}"
            IFS=. read -r major minor patch <<< "${base}"
            case "${IN_BUMP}" in
              major) major=$((major + 1)); minor=0; patch=0 ;;
              minor) minor=$((minor + 1)); patch=0 ;;
              patch) patch=$((patch + 1)) ;;
              *) echo "Unknown bump ${IN_BUMP}"; exit 1 ;;
            esac
            version="${major}.${minor}.${patch}"
          fi

          if ! [[ "${version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z]+([.-][0-9A-Za-z]+)*)?$ ]]; then
            echo "Not a valid version: ${version}"
            exit 1
          fi

          if git rev-parse -q --verify "refs/tags/v${version}" >/dev/null; then
            echo "Tag v${version} already exists"
            exit 1
          fi

          if [ -n "${IN_VERSION}" ]; then
            if [ -n "${last}" ]; then
              IFS=. read -r prev_major prev_minor _prev_patch <<< "${last#v}"
              IFS=. read -r new_major new_minor _new_patch <<< "${version}"
              if [ "${prev_major}" = "${new_major}" ] && [ "${prev_minor}" = "${new_minor}" ]; then
                kind="Update"
              else
                kind="Release"
              fi
            else
              kind="Release"
            fi
          elif [ "${IN_BUMP}" = "patch" ]; then
            kind="Update"
          else
            kind="Release"
          fi

          echo "Releasing v${version} as ${kind} ${version}"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "tag=v${version}" >> "$GITHUB_OUTPUT"
          echo "previous=${last}" >> "$GITHUB_OUTPUT"
          echo "title=${kind} ${version}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        if: steps.registries.outputs.dockerhub_enabled == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ steps.registries.outputs.images }}
          tags: |
            type=raw,value=${{ steps.ver.outputs.version }}
            type=raw,value=latest,enable=${{ inputs.latest }}
          labels: |
            org.opencontainers.image.version=${{ steps.ver.outputs.version }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          build-args: |
            APP_VERSION=${{ steps.ver.outputs.tag }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Tag release
        env:
          TAG: ${{ steps.ver.outputs.tag }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "${TAG}" -m "${TAG}"
          git push origin "${TAG}"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.ver.outputs.tag }}
          TITLE: ${{ steps.ver.outputs.title }}
          PREVIOUS: ${{ steps.ver.outputs.previous }}
          DRAFT: ${{ inputs.draft }}
          LATEST: ${{ inputs.latest }}
          DISCUSSION: ${{ inputs.discussion }}
          DISCUSSION_CATEGORY: ${{ inputs.discussion_category }}
        run: |
          set -euo pipefail
          args=(--title "${TITLE}" --generate-notes --verify-tag)
          if [ -n "${PREVIOUS}" ]; then args+=(--notes-start-tag "${PREVIOUS}"); fi
          if [ "${DRAFT}" = "true" ]; then args+=(--draft); fi
          if [ "${LATEST}" = "true" ]; then args+=(--latest); fi
          if [ "${DISCUSSION}" = "true" ]; then
            if [ "${DRAFT}" = "true" ]; then
              echo "Draft releases cannot open a discussion, skipping"
            else
              args+=(--discussion-category "${DISCUSSION_CATEGORY}")
            fi
          fi
          gh release create "${TAG}" "${args[@]}"

      - name: Summary
        env:
          DOCKERHUB_ENABLED: ${{ steps.registries.outputs.dockerhub_enabled }}
        run: |
          {
            echo "### Released ${{ steps.ver.outputs.tag }}"
            echo
            echo '```'
            echo "docker pull ${{ env.IMAGE }}:${{ steps.ver.outputs.version }}"
            if [ "${DOCKERHUB_ENABLED}" = "true" ]; then
              echo "docker pull ${{ env.DOCKERHUB_IMAGE }}:${{ steps.ver.outputs.version }}"
            fi
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
